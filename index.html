<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
}

/* HEADER */
header {
    background: #00c896;
    padding: 20px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
}

/* HERO */
.hero {
    text-align: center;
    padding: 100px 20px;
    animation: fadeIn 1.5s ease;
}

.hero h1 {
    font-size: 42px;
}

.btn {
    background: #00c896;
    color: black;
    padding: 15px 30px;
    border-radius: 10px;
    text-decoration: none;
    display: inline-block;
    margin-top: 20px;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.1);
    background: #00e6a8;
}

/* SERVICES */
.services {
    padding: 60px 20px;
    text-align: center;
}

.cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
}

.card {
    background: #1a1a1a;
    padding: 20px;
    width: 250px;
    border-radius: 15px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-10px);
}

/* ANIMACIONES */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

/* WHATSAPP FLOAT */
.whatsapp {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #25D366;
    color: white;
    padding: 15px;
    border-radius: 50%;
    font-size: 20px;
    text-decoration: none;
}
</style>

</head>
